version: 2.1

workflows:
  version: 2
  build_pipeline:
    jobs:
      - build:
          filters:
            tags:
              only: /.*/
            branches:
              ignore: /.*/

jobs:
  build:
    docker:
      - image: cimg/base:current
    steps:
      - checkout
      - setup_remote_docker:
          version: default
      - run:
          command: |
            IMAGE=$DOCKER_USER/node-xcb
            TAG_NODE_MAJOR=node-24
            TAG_VERSION=node-$CIRCLE_TAG
            echo $DOCKER_PASS | docker login -u $DOCKER_USER --password-stdin
            docker build -t $IMAGE .
            docker tag $IMAGE $IMAGE:$TAG_VERSION
            docker tag $IMAGE $IMAGE:$TAG_NODE_MAJOR
            docker push $IMAGE:$TAG_VERSION
            docker push $IMAGE:$TAG_NODE_MAJOR
            docker push $IMAGE:latest
